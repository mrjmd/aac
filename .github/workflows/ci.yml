# CI: typecheck + test, lint, then build, on every push and pull request.
#
# No notifications of any kind. Results are read through the GitHub API
# (command center System health page), so keep the workflow, job and step
# names stable: "CI" / "check" / the step names below.
#
# No secrets are needed: every test mocks its clients, and every build
# (tsc for the plain-function apps, next build for the Next.js apps) reads
# env at request time, not build time. If a build ever starts needing a
# secret, fix the build rather than adding the secret here.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from "packageManager" in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Matches the Vercel projects (Node 24.x).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm turbo typecheck test

      # Warn-only config (eslint.config.mjs), so this fails only on real
      # errors. Tighten rules there, not here.
      - name: Lint
        run: pnpm turbo lint

      # Separate step: running build alongside typecheck races on the
      # Next.js apps' generated route types.
      - name: Build
        run: pnpm turbo build
